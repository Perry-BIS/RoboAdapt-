[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "roboadapt"
version = "1.1.0.dev0"
description = "A reproducible MuJoCo benchmark for manipulation under pose uncertainty"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
  "mujoco==3.3.7",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "matplotlib==3.10.7",
  "PyYAML==6.0.3",
  "imageio==2.37.0",
]

[tool.setuptools.packages.find]
include = ["roboadapt*"]

[tool.setuptools.package-data]
roboadapt = ["assets/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

